<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="走啦~打球" />
  <link rel="icon" type="image/png" href="./badminton go.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="./badminton go.png" />
  <title>走啦~打球</title>
  <style>
    :root {
      --primary: #6A5ACD;
      --primary-dark: #5445B5;
      --primary-soft: rgba(106, 90, 205, 0.12);
      --bg: #F5F6FA;
      --card: #FFFFFF;
      --text: #1E2230;
      --text-sub: #6E768A;
      --border: #E6E9F2;
      --success: #10B981;
      --danger: #EF4444;
      --female: #EC4899;
      --female-soft: rgba(236, 72, 153, 0.12);
      --shadow: 0 6px 20px rgba(30, 34, 48, 0.05);
      --radius: 18px;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      padding: 0 0 108px 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      touch-action: manipulation;
    }

    .purple-banner {
      background: linear-gradient(135deg, #6A5ACD 0%, #5848B8 100%);
      color: #FFFFFF;
      padding: 13px 16px;
      position: sticky;
      top: 0;
      z-index: 30;
      box-shadow: 0 4px 14px rgba(106, 90, 205, 0.25);
    }

    .banner-inner {
      max-width: 600px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 9px;
      font-size: 18px;
      font-weight: 900;
      letter-spacing: 0.3px;
      color: #FFFFFF;
    }

    .shuttle-icon {
      width: 28px;
      height: 28px;
      flex-shrink: 0;
    }

    .banner-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .mode-pill {
      display: inline-flex;
      background: rgba(255, 255, 255, 0.18);
      border-radius: 999px;
      padding: 3px;
    }

    .mode-btn {
      border: none;
      background: transparent;
      color: rgba(255, 255, 255, 0.85);
      font-weight: 800;
      font-size: 12px;
      padding: 4px 9px;
      border-radius: 999px;
      cursor: pointer;
    }

    .mode-btn.active {
      background: #FFFFFF;
      color: var(--primary);
    }

    .banner-btn {
      border: 1px solid rgba(255, 255, 255, 0.45);
      background: rgba(255, 255, 255, 0.14);
      color: #FFFFFF;
      font-weight: 800;
      font-size: 12px;
      padding: 6px 9px;
      border-radius: 10px;
      cursor: pointer;
      white-space: nowrap;
    }

    .app-wrap {
      max-width: 600px;
      margin: 0 auto;
      padding: 14px 14px 20px;
    }

    .session-bar {
      background: var(--card);
      border-radius: 16px;
      padding: 12px 14px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      box-shadow: var(--shadow);
    }

    .session-status {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 800;
    }

    .status-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #CBD5E1;
    }

    .status-dot.live {
      background: var(--success);
      box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.18);
    }

    .btn-start {
      border: none;
      background: var(--primary);
      color: #fff;
      font-weight: 800;
      font-size: 13px;
      padding: 8px 16px;
      border-radius: 11px;
      cursor: pointer;
    }

    .btn-end {
      border: 1px solid rgba(239, 68, 68, 0.35);
      background: rgba(239, 68, 68, 0.08);
      color: var(--danger);
      font-weight: 800;
      font-size: 12px;
      padding: 7px 12px;
      border-radius: 11px;
      cursor: pointer;
    }

    .court-card {
      background: linear-gradient(160deg, #6A5ACD 0%, #5646B5 100%);
      border-radius: 22px;
      padding: 14px;
      margin-bottom: 14px;
      color: #FFFFFF;
      box-shadow: 0 12px 26px rgba(106, 90, 205, 0.28);
    }

    .court-top-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      font-weight: 800;
      margin-bottom: 10px;
      gap: 6px;
      flex-wrap: wrap;
    }

    .court-badge {
      background: rgba(255, 255, 255, 0.18);
      padding: 3px 9px;
      border-radius: 999px;
      font-size: 11px;
    }

    .badminton-court {
      position: relative;
      border: 2px solid rgba(255, 255, 255, 0.72);
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.06);
      display: grid;
      grid-template-columns: 1fr 1fr;
      overflow: hidden;
      margin-bottom: 12px;
    }

    .badminton-court::after {
      content: "";
      position: absolute;
      top: 0;
      bottom: 0;
      left: 50%;
      border-left: 2px dashed rgba(255, 255, 255, 0.85);
      transform: translateX(-50%);
      pointer-events: none;
    }

    .court-half {
      position: relative;
      padding: 12px 10px 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      min-height: 205px;
      gap: 12px;
    }

    .court-half::before {
      content: "";
      position: absolute;
      inset: 8px 6px;
      border-top: 1px solid rgba(255, 255, 255, 0.35);
      border-bottom: 1px solid rgba(255, 255, 255, 0.35);
      pointer-events: none;
    }

    .half-header {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.5px;
      opacity: 0.85;
    }

    .court-players {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 6px;
      z-index: 2;
    }

    .court-player-slot {
      background: rgba(255, 255, 255, 0.95);
      color: var(--text);
      border-radius: 10px;
      padding: 6px 8px;
      font-size: 13px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.12);
    }

    .gender-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--primary);
      display: inline-block;
    }

    .gender-dot.f {
      background: var(--female);
    }

    .win-btn {
      width: 86%;
      border: none;
      background: #FFFFFF;
      color: var(--primary);
      font-size: 18px;
      font-weight: 900;
      letter-spacing: 2px;
      padding: 11px 0;
      border-radius: 13px;
      cursor: pointer;
      z-index: 2;
      box-shadow: 0 5px 14px rgba(0, 0, 0, 0.18);
    }

    .win-btn:active {
      transform: scale(0.96);
      background: #F1EFFE;
    }

    .court-footer-btns {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .btn-court-ghost {
      border: 1px solid rgba(255, 255, 255, 0.42);
      background: rgba(255, 255, 255, 0.14);
      color: #FFFFFF;
      font-weight: 800;
      font-size: 13px;
      padding: 10px;
      border-radius: 12px;
      cursor: pointer;
    }

    .btn-court-solid {
      border: none;
      background: #FFFFFF;
      color: var(--primary);
      font-weight: 900;
      font-size: 13px;
      padding: 10px;
      border-radius: 12px;
      cursor: pointer;
    }

    .white-card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 14px 16px;
      margin-bottom: 12px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 10px;
    }

    .card-title {
      font-size: 14px;
      font-weight: 900;
      margin: 0;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .pill-tag {
      font-size: 11px;
      font-weight: 800;
      padding: 2px 8px;
      border-radius: 999px;
      background: var(--primary-soft);
      color: var(--primary);
    }

    .pill-tag.f {
      background: var(--female-soft);
      color: var(--female);
    }

    .prep-box {
      background: var(--bg);
      border-radius: 14px;
      padding: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .prep-teams {
      font-size: 14px;
      font-weight: 900;
    }

    .btn-outline {
      border: 1.5px solid var(--primary);
      background: #FFFFFF;
      color: var(--primary);
      font-weight: 800;
      font-size: 12px;
      padding: 7px 11px;
      border-radius: 10px;
      cursor: pointer;
      white-space: nowrap;
    }

    .bench-list {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
    }

    .bench-chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 6px 10px;
      border-radius: 11px;
      font-size: 12px;
      font-weight: 800;
      background: var(--bg);
      border: 1px solid var(--border);
    }

    .bench-chip.next-up {
      border-color: rgba(106, 90, 205, 0.4);
      background: var(--primary-soft);
      color: var(--primary);
    }

    .form-grid-simple {
      display: grid;
      grid-template-columns: 1.6fr 0.8fr auto;
      gap: 8px;
    }

    input, select {
      width: 100%;
      padding: 9px 10px;
      border-radius: 10px;
      border: 1px solid var(--border);
      font-size: 13px;
      background: #fff;
      color: var(--text);
      font-family: inherit;
    }

    .btn-primary {
      border: none;
      background: var(--primary);
      color: #fff;
      font-weight: 800;
      font-size: 13px;
      padding: 9px 14px;
      border-radius: 10px;
      cursor: pointer;
      white-space: nowrap;
    }

    .player-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
    }

    .player-item:last-child {
      border-bottom: none;
    }

    .player-meta-row {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 14px;
      font-weight: 800;
    }

    .sub-text {
      font-size: 12px;
      color: var(--text-sub);
    }

    .item-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .mini-icon-btn {
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 12px;
      font-weight: 800;
      padding: 5px 8px;
      border-radius: 8px;
      cursor: pointer;
    }

    .mini-icon-btn.del {
      color: var(--danger);
      border-color: rgba(239, 68, 68, 0.25);
      background: rgba(239, 68, 68, 0.06);
    }

    .switch {
      position: relative;
      display: inline-block;
      width: 42px;
      height: 23px;
      flex-shrink: 0;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      inset: 0;
      background-color: #CBD5E1;
      transition: 0.2s;
      border-radius: 999px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 17px;
      width: 17px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: 0.2s;
      border-radius: 50%;
    }

    input:checked + .slider {
      background-color: var(--primary);
    }

    input:checked + .slider:before {
      transform: translateX(19px);
    }

    .avoid-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--bg);
      border: 1px solid var(--border);
      padding: 5px 9px;
      border-radius: 9px;
      font-size: 12px;
      font-weight: 800;
      margin: 6px 6px 0 0;
    }

    .kpi-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 12px;
    }

    .kpi-box {
      background: var(--bg);
      border-radius: 12px;
      padding: 10px;
      text-align: center;
    }

    .kpi-num {
      font-size: 20px;
      font-weight: 900;
      color: var(--primary);
    }

    .standing-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
    }

    .standing-item:last-child {
      border-bottom: none;
    }

    .delta-pos { color: var(--success); font-weight: 900; }
    .delta-neg { color: var(--danger); font-weight: 900; }

    .session-group {
      border-left: 4px solid var(--primary);
      background: rgba(106, 90, 205, 0.03);
      border-radius: 0 14px 14px 0;
      padding: 10px 10px 4px 12px;
      margin-bottom: 16px;
    }

    .session-group.ended {
      border-left-color: #94A3B8;
      background: #F8FAFC;
    }

    .session-divider-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding-bottom: 8px;
      margin-bottom: 8px;
      border-bottom: 1px dashed rgba(106, 90, 205, 0.28);
      font-size: 12px;
      font-weight: 900;
      color: var(--primary);
    }

    .session-group.ended .session-divider-header {
      color: var(--text-sub);
      border-bottom-color: #CBD5E1;
    }

    .history-row {
      background: #FFFFFF;
      border: 1px solid var(--border);
      border-radius: 11px;
      padding: 9px 12px;
      margin-bottom: 7px;
      font-size: 13px;
    }

    .empty-box {
      text-align: center;
      color: var(--text-sub);
      font-size: 13px;
      padding: 16px 8px;
    }

    /* 懸浮圓角膠囊底部導覽列 */
    .floating-nav-wrap {
      position: fixed;
      left: 0;
      right: 0;
      bottom: max(12px, env(safe-area-inset-bottom));
      padding: 0 18px;
      z-index: 25;
      pointer-events: none;
    }

    .floating-nav {
      pointer-events: auto;
      max-width: 460px;
      margin: 0 auto;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(230, 233, 242, 0.95);
      border-radius: 999px;
      padding: 6px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      box-shadow: 0 10px 28px rgba(30, 34, 48, 0.14);
    }

    .nav-btn {
      flex: 1;
      border: none;
      background: transparent;
      color: var(--text-sub);
      font-size: 13px;
      font-weight: 800;
      padding: 10px 8px;
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.16s ease;
    }

    .nav-btn.active {
      color: #FFFFFF;
      background: var(--primary);
      box-shadow: 0 4px 12px rgba(106, 90, 205, 0.28);
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.45);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 60;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-card {
      width: 100%;
      max-width: 400px;
      background: #FFFFFF;
      border-radius: 20px;
      padding: 18px;
      box-shadow: 0 20px 45px rgba(15, 23, 42, 0.25);
    }

    .toast {
      position: fixed;
      top: 66px;
      left: 50%;
      transform: translateX(-50%) translateY(-20px);
      opacity: 0;
      background: #1E2230;
      color: #fff;
      font-size: 12px;
      font-weight: 800;
      padding: 8px 15px;
      border-radius: 999px;
      z-index: 80;
      transition: all 0.2s ease;
      pointer-events: none;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    svg.trend-chart {
      width: 100%;
      height: 120px;
      background: var(--bg);
      border-radius: 12px;
    }
  </style>
</head>
<body>
  <div id="toast" class="toast"></div>

  <header class="purple-banner">
    <div class="banner-inner">
      <div class="brand">
        <svg class="shuttle-icon" viewBox="0 0 100 100" fill="none">
          <g transform="rotate(-45 50 50)">
            <path d="M23 18C23 13.5 26.5 10 31 10C35 10 38 12.8 38.5 16.5L41 37H25.5L23 18Z" fill="#FFFFFF"/>
            <path d="M36 14C36 9.5 39.5 6 44 6C48 6 51 8.8 51.5 12.5L52 37H38L36 14Z" fill="#FFFFFF"/>
            <path d="M49 14C49 9.5 52.5 6 57 6C61 6 64 8.8 64.5 12.5L63.5 37H50L49 14Z" fill="#FFFFFF"/>
            <path d="M62 18C62 13.5 65.5 10 70 10C74 10 77 12.8 77.5 16.5L74.5 37H61L62 18Z" fill="#FFFFFF"/>
            <rect x="27" y="40.5" width="46" height="6.5" rx="1.5" fill="#FFFFFF"/>
            <rect x="30" y="50.5" width="40" height="6.5" rx="1.5" fill="#FFFFFF"/>
            <path d="M32 61H68V66C68 76 60 84 50 84C40 84 32 76 32 66V61Z" fill="#FFFFFF"/>
          </g>
        </svg>
        <span>走啦~打球</span>
      </div>

      <div class="banner-actions">
        <div class="mode-pill">
          <button type="button" id="btnMode21" class="mode-btn active">21分</button>
          <button type="button" id="btnMode11" class="mode-btn">11分</button>
        </div>
        <button type="button" id="btnOpenAccount" class="banner-btn">預設球團</button>
        <button type="button" id="btnOpenQuickAdd" class="banner-btn">+ 球友</button>
      </div>
    </div>
  </header>

  <div class="app-wrap">
    <section id="tab-match" class="tab-view">
      <div class="session-bar">
        <div class="session-status">
          <span id="sessionDot" class="status-dot"></span>
          <span id="sessionLabel">尚未開打</span>
        </div>
        <div id="sessionActionArea"></div>
      </div>

      <div id="courtSection"></div>

      <div class="white-card">
        <div class="card-header">
          <h2 class="card-title">下一場準備區</h2>
          <button type="button" id="btnShuffleNext" class="btn-outline">換一組</button>
        </div>
        <div id="nextPrepContainer"></div>
      </div>

      <div class="white-card">
        <div class="card-header">
          <h2 class="card-title">場邊輪替</h2>
          <span id="activeSummaryTag" class="pill-tag">0 人出席</span>
        </div>
        <div id="benchListContainer" class="bench-list"></div>
      </div>
    </section>

    <section id="tab-players" class="tab-view" style="display:none;">
      <div class="white-card">
        <div class="card-header">
          <h2 class="card-title">新增球友</h2>
        </div>
        <div class="form-grid-simple">
          <input id="newPlayerName" type="text" placeholder="暱稱" />
          <select id="newPlayerGender">
            <option value="M">男</option>
            <option value="F">女</option>
          </select>
          <button type="button" id="btnAddPlayerForm" class="btn-primary">新增</button>
        </div>
      </div>

      <div class="white-card">
        <div class="card-header">
          <h2 class="card-title">球友名單</h2>
          <span id="activeCountBadge" class="pill-tag">出席 0 人</span>
        </div>
        <div id="playerListContainer"></div>
      </div>

      <div class="white-card">
        <div class="card-header">
          <h2 class="card-title">不要同組設定</h2>
          <span class="pill-tag f">2女自動拆混雙</span>
        </div>
        <div class="form-grid-simple">
          <select id="avoidPlayerA"></select>
          <select id="avoidPlayerB"></select>
          <button type="button" id="btnAddAvoidPair" class="btn-outline">加入</button>
        </div>
        <div id="avoidListContainer"></div>
      </div>

      <div class="white-card">
        <div class="card-header">
          <h2 class="card-title">目前球團與備份</h2>
          <span id="currentAccountTag" class="pill-tag">預設球團</span>
        </div>
        <div style="display:flex; gap:8px; flex-wrap:wrap;">
          <button type="button" id="btnSwitchAccountCard" class="mini-icon-btn">切換 / 建立球團</button>
          <button type="button" id="btnExportJson" class="mini-icon-btn">匯出備份</button>
          <button type="button" id="btnImportJsonTrigger" class="mini-icon-btn">匯入備份</button>
          <input id="importFileInput" type="file" accept=".json" style="display:none;" />
          <button type="button" id="btnResetDemo" class="mini-icon-btn del">清空目前紀錄</button>
        </div>
      </div>
    </section>

    <section id="tab-stats" class="tab-view" style="display:none;">
      <div class="white-card">
        <div class="card-header">
          <h2 class="card-title">戰績排行</h2>
          <button type="button" id="btnCopySummary" class="btn-outline">複製摘要</button>
        </div>
        <div class="kpi-row">
          <div class="kpi-box">
            <div id="kpiTotalGames" class="kpi-num">0</div>

  <script>
    (function () {
      const ACCOUNT_INDEX_KEY = 'lets_play_accounts_v2';
      const CURRENT_ACCOUNT_KEY = 'lets_play_current_account_v2';

      const EMPTY_STATE = {
        sessionActive: false,
        currentSessionId: null,
        pointMode: 21,
        players: [],
        avoidPairs: [],
        currentMatch: null,
        nextMatch: null,
        undoMatchSnapshot: null,
        sessions: [],
        matches: []
      };

      const FRIDAY_CLUB_STATE = {
        sessionActive: false,
        currentSessionId: null,
        pointMode: 21,
        players: [
          { id: 'fri_1', name: 'Peter', gender: 'M', active: true, dayGames: 0, dayW: 0, dayL: 0, dayDiff: 0, dayDelta: 0, history: [0] },
          { id: 'fri_2', name: 'Amy', gender: 'F', active: true, dayGames: 0, dayW: 0, dayL: 0, dayDiff: 0, dayDelta: 0, history: [0] },
          { id: 'fri_3', name: 'Anna', gender: 'F', active: true, dayGames: 0, dayW: 0, dayL: 0, dayDiff: 0, dayDelta: 0, history: [0] },
          { id: 'fri_4', name: 'Eric', gender: 'M', active: true, dayGames: 0, dayW: 0, dayL: 0, dayDiff: 0, dayDelta: 0, history: [0] },
          { id: 'fri_5', name: 'Max', gender: 'M', active: true, dayGames: 0, dayW: 0, dayL: 0, dayDiff: 0, dayDelta: 0, history: [0] },
          { id: 'fri_6', name: 'Winston', gender: 'M', active: true, dayGames: 0, dayW: 0, dayL: 0, dayDiff: 0, dayDelta: 0, history: [0] },
          { id: 'fri_7', name: 'Dlyan', gender: 'M', active: true, dayGames: 0, dayW: 0, dayL: 0, dayDiff: 0, dayDelta: 0, history: [0] }
        ],
        avoidPairs: [['fri_2', 'fri_3']],
        currentMatch: null,
        nextMatch: null,
        undoMatchSnapshot: null,
        sessions: [],
        matches: []
      };

      function cloneObj(obj) {
        return JSON.parse(JSON.stringify(obj));
      }

      function getDefaultTemplateForAccount(acc) {
        if (acc === '周五羽球團') return cloneObj(FRIDAY_CLUB_STATE);
        return cloneObj(EMPTY_STATE);
      }

      function storageKeyForAccount(acc) {
        return 'lets_play_v2_data_' + encodeURIComponent(acc);
      }

      function initializeDefaultClubs() {
        let list = [];
        try {
          list = JSON.parse(localStorage.getItem(ACCOUNT_INDEX_KEY) || '[]');
        } catch (e) {
          list = [];
        }
        if (!Array.isArray(list) || list.length === 0) {
          list = ['預設球團', '周五羽球團'];
          localStorage.setItem(ACCOUNT_INDEX_KEY, JSON.stringify(list));
        } else if (!list.includes('周五羽球團')) {
          list.push('周五羽球團');
          localStorage.setItem(ACCOUNT_INDEX_KEY, JSON.stringify(list));
        }

        if (!localStorage.getItem(storageKeyForAccount('周五羽球團'))) {
          localStorage.setItem(storageKeyForAccount('周五羽球團'), JSON.stringify(cloneObj(FRIDAY_CLUB_STATE)));
        }
      }

      initializeDefaultClubs();

      function getAccountList() {
        try {
          const list = JSON.parse(localStorage.getItem(ACCOUNT_INDEX_KEY) || '[]');
          return list.length ? list : ['預設球團', '周五羽球團'];
        } catch (e) {
          return ['預設球團', '周五羽球團'];
        }
      }

      function saveAccountList(list) {
        try {
          localStorage.setItem(ACCOUNT_INDEX_KEY, JSON.stringify(list));
        } catch (e) {}
      }

      let currentAccount = localStorage.getItem(CURRENT_ACCOUNT_KEY) || '預設球團';
      if (!getAccountList().includes(currentAccount)) {
        saveAccountList([...getAccountList(), currentAccount]);
      }

      function loadStateForAccount(acc) {
        try {
          const raw = localStorage.getItem(storageKeyForAccount(acc));
          if (!raw) return getDefaultTemplateForAccount(acc);
          const parsed = JSON.parse(raw);
          return Object.assign(cloneObj(EMPTY_STATE), parsed);
        } catch (e) {
          return getDefaultTemplateForAccount(acc);
        }
      }

      let state = loadStateForAccount(currentAccount);

      function saveState() {
        try {
          localStorage.setItem(storageKeyForAccount(currentAccount), JSON.stringify(state));
        } catch (e) {}
      }

      function formatDateTime(ts) {
        const d = ts ? new Date(ts) : new Date();
        const pad = n => String(n).padStart(2, '0');
        return `${d.getFullYear()}/${pad(d.getMonth() + 1)}/${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
      }

      function formatTimeOnly(ts) {
        const d = ts ? new Date(ts) : new Date();
        const pad = n => String(n).padStart(2, '0');
        return `${pad(d.getHours())}:${pad(d.getMinutes())}`;
      }

      function showToast(msg) {
        const el = document.getElementById('toast');
        if (!el) return;
        el.textContent = msg;
        el.classList.add('show');
        clearTimeout(showToast._t);
        showToast._t = setTimeout(() => el.classList.remove('show'), 2100);
      }

      function getPlayer(id) {
        return state.players.find(p => p.id === id);
      }

      function getActivePlayers() {
        return state.players.filter(p => p.active);
      }

      function isAvoidPair(aId, bId) {
        return state.avoidPairs.some(
          pair => (pair[0] === aId && pair[1] === bId) || (pair[0] === bId && pair[1] === aId)
        );
      }

      function isRoundOpener(active, virtualGamesMap) {
        if (active.length < 4) return false;
        const counts = active.map(p => virtualGamesMap[p.id] ?? p.dayGames);
        return Math.min(...counts) === Math.max(...counts);
      }

      function shuffleArray(arr) {
        const copy = [...arr];
        for (let i = copy.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [copy[i], copy[j]] = [copy[j], copy[i]];
        }
        return copy;
      }

      function recentRepeatPenalty(playerIds, recentMatchList) {
        let penalty = 0;
        const set = new Set(playerIds);
        recentMatchList.slice(0, 3).forEach((m, idx) => {
          const weight = (3 - idx) * 18;
          const aOverlap = m.teamA.filter(id => set.has(id)).length;
          const bOverlap = m.teamB.filter(id => set.has(id)).length;
          if (aOverlap >= 2) penalty += weight * 2;
          if (bOverlap >= 2) penalty += weight * 2;
          if (aOverlap >= 1 && bOverlap >= 1) penalty += weight;
        });
        return penalty;
      }

      function buildMatchFromVirtualGames(virtualGamesMap, extraRecentMatches = []) {
        const active = getActivePlayers();
        if (active.length < 4) return null;

        const roundStart = isRoundOpener(active, virtualGamesMap);
        const minGames = Math.min(...active.map(p => virtualGamesMap[p.id] ?? p.dayGames));

        const leastPlayed = shuffleArray(
          active.filter(p => (virtualGamesMap[p.id] ?? p.dayGames) === minGames)
        );
        const others = shuffleArray(
          active.filter(p => (virtualGamesMap[p.id] ?? p.dayGames) > minGames)
        );

        let pool = [...leastPlayed, ...others];

        if (roundStart) {
          const femalesFirst = shuffleArray(active.filter(p => p.gender === 'F'));
          const rest = shuffleArray(active.filter(p => !femalesFirst.some(f => f.id === p.id)));
          pool = [...femalesFirst, ...rest];
        }

        const four = pool.slice(0, 4);
        const splits = [
          [[four[0], four[1]], [four[2], four[3]]],
          [[four[0], four[2]], [four[1], four[3]]],
          [[four[0], four[3]], [four[1], four[2]]]
        ];

        const femaleCount = four.filter(p => p.gender === 'F').length;
        const recent = [...extraRecentMatches, ...state.matches];

        const scoredSplits = splits.map(split => {
          const [tA, tB] = split;
          let penalty = 0;

          if (isAvoidPair(tA[0].id, tA[1].id)) penalty += 10000;
          if (isAvoidPair(tB[0].id, tB[1].id)) penalty += 10000;

          if (femaleCount === 2) {
            const fA = tA.filter(p => p.gender === 'F').length;
            const fB = tB.filter(p => p.gender === 'F').length;
            if (!(fA === 1 && fB === 1)) {
              penalty += 5000;
            }
          }

          penalty += recentRepeatPenalty(four.map(p => p.id), recent);
          const score = penalty + Math.random() * 35;
          return { split, score };
        });

        scoredSplits.sort((a, b) => a.score - b.score);
        const chosen = scoredSplits[0].split;

        const swapSides = Math.random() < 0.5;
        const finalA = swapSides ? chosen[1] : chosen[0];
        const finalB = swapSides ? chosen[0] : chosen[1];

        return {
          teamA: finalA.map(p => p.id),
          teamB: finalB.map(p => p.id),
          customScoreA: null,
          customScoreB: null,
          mode: state.pointMode,
          isRoundStart: roundStart
        };
      }

      function syncMatchQueue() {
        const active = getActivePlayers();
        if (active.length < 4) {
          state.currentMatch = null;
          state.nextMatch = null;
          return;
        }

        const baseMap = {};
        active.forEach(p => { baseMap[p.id] = p.dayGames; });

        if (!state.currentMatch) {
          state.currentMatch = buildMatchFromVirtualGames(baseMap, []);
        }

        const nextMap = Object.assign({}, baseMap);
        const extraRecent = [];
        if (state.currentMatch) {
          [...state.currentMatch.teamA, ...state.currentMatch.teamB].forEach(id => {
            if (nextMap[id] !== undefined) nextMap[id] += 1;
          });
          extraRecent.push({
            teamA: state.currentMatch.teamA,
            teamB: state.currentMatch.teamB
          });
        }
        state.nextMatch = buildMatchFromVirtualGames(nextMap, extraRecent);
      }

      function startSession() {
        const active = getActivePlayers();
        if (active.length < 4) {
          showToast('請先到「球友設定」新增並勾選至少 4 人');
          return;
        }
        const now = Date.now();
        const sessionId = 'sess_' + now;
        state.sessionActive = true;
        state.currentSessionId = sessionId;
        state.sessions.unshift({
          id: sessionId,
          startTime: now,
          endTime: null
        });
        state.currentMatch = null;
        state.nextMatch = null;
        state.undoMatchSnapshot = null;
        syncMatchQueue();
        saveState();
        renderAll();
        showToast('開打啦！首場已優先安排女生上場');
      }

      function openEndSummaryModal() {
        const active = getActivePlayers();
        const sessionMatches = state.matches.filter(m => m.sessionId === state.currentSessionId);
        const playedPlayers = [...state.players]
          .filter(p => p.dayGames > 0)
          .sort((a, b) => b.dayDelta - a.dayDelta);

        let html = `<div class="kpi-row">
          <div class="kpi-box"><div class="kpi-num">${sessionMatches.length}</div><div class="sub-text">本場次局數</div></div>
          <div class="kpi-box"><div class="kpi-num">${active.length}</div><div class="sub-text">出席人數</div></div>
          <div class="kpi-box"><div class="kpi-num">${playedPlayers[0] ? playedPlayers[0].name : '-'}</div><div class="sub-text">積分最高</div></div>
        </div>`;

        if (playedPlayers.length === 0) {
          html += `<div class="empty-box">本場次尚未完成任何勝負紀錄</div>`;
        } else {
          html += playedPlayers.map(p => {
            const sign = p.dayDelta > 0 ? '+' : '';
            return `<div style="display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px solid var(--border); font-size:13px;">
              <span><strong>${p.name}</strong>（打 ${p.dayGames} 場 · ${p.dayW}勝${p.dayL}負）</span>
              <span class="${p.dayDelta >= 0 ? 'delta-pos' : 'delta-neg'}">${sign}${p.dayDelta}</span>
            </div>`;
          }).join('');
        }

        document.getElementById('summaryModalBody').innerHTML = html;
        document.getElementById('summaryModal').classList.add('open');
      }

      function confirmEndSession() {
        const currSess = state.sessions.find(s => s.id === state.currentSessionId);
        if (currSess && !currSess.endTime) {
          currSess.endTime = Date.now();
        }
        state.sessionActive = false;
        state.currentSessionId = null;
        state.currentMatch = null;
        state.nextMatch = null;
        state.undoMatchSnapshot = null;
        document.getElementById('summaryModal').classList.remove('open');
        saveState();
        renderAll();
        showToast('已結束收工並標記場次時間');
      }

      function setPointMode(mode) {
        state.pointMode = mode;
        if (state.currentMatch) state.currentMatch.mode = mode;
        if (state.nextMatch) state.nextMatch.mode = mode;
        saveState();
        renderAll();
        showToast(`切換為 ${mode} 分制`);
      }

      function openScoreModal() {
        if (!state.sessionActive || !state.currentMatch) return;
        const aNames = state.currentMatch.teamA.map(id => getPlayer(id)?.name || '').join('＋');
        const bNames = state.currentMatch.teamB.map(id => getPlayer(id)?.name || '').join('＋');
        document.getElementById('modalTeamALabel').textContent = aNames;
        document.getElementById('modalTeamBLabel').textContent = bNames;
        document.getElementById('modalScoreA').value = state.currentMatch.customScoreA ?? '';
        document.getElementById('modalScoreB').value = state.currentMatch.customScoreB ?? '';
        document.getElementById('scoreModal').classList.add('open');
      }

      function applyManualScore() {
        if (!state.currentMatch) return;
        const rawA = document.getElementById('modalScoreA').value;
        const rawB = document.getElementById('modalScoreB').value;
        state.currentMatch.customScoreA = rawA === '' ? null : Math.max(0, parseInt(rawA, 10) || 0);
        state.currentMatch.customScoreB = rawB === '' ? null : Math.max(0, parseInt(rawB, 10) || 0);
        document.getElementById('scoreModal').classList.remove('open');
        saveState();
        renderMatchTab();
        showToast('已記錄選填比分');
      }

      function recordWin(winnerSide) {
        if (!state.sessionActive) {
          showToast('請先按「開始打球」');
          return;
        }
        const m = state.currentMatch;
        if (!m) return;

        // 儲存上一局快照以便撤銷
        state.undoMatchSnapshot = {
          players: cloneObj(state.players),
          matches: cloneObj(state.matches),
          currentMatch: cloneObj(state.currentMatch),
          nextMatch: cloneObj(state.nextMatch)
        };

        const modeWeight = m.mode === 21 ? 1.0 : 0.5;
        let diffBonus = 0;
        if (m.customScoreA !== null && m.customScoreB !== null) {
          diffBonus = Math.min(6, Math.round(Math.abs(m.customScoreA - m.customScoreB) * 0.4));
        }

        const aWon = winnerSide === 'A';
        const deltaA = Math.round(((aWon ? 12 : -8) + (aWon ? diffBonus : -Math.floor(diffBonus * 0.5))) * modeWeight);
        const deltaB = Math.round(((!aWon ? 12 : -8) + (!aWon ? diffBonus : -Math.floor(diffBonus * 0.5))) * modeWeight);
        const pointDiffAB = (m.customScoreA !== null && m.customScoreB !== null)
          ? (m.customScoreA - m.customScoreB)
          : 0;

        const teamAPlayers = m.teamA.map(getPlayer).filter(Boolean);
        const teamBPlayers = m.teamB.map(getPlayer).filter(Boolean);

        teamAPlayers.forEach(p => {
          p.dayGames += 1;
          p.dayW += aWon ? 1 : 0;
          p.dayL += aWon ? 0 : 1;
          p.dayDiff += pointDiffAB;
          p.dayDelta += deltaA;
          if (!Array.isArray(p.history) || p.history.length === 0) p.history = [0];
          p.history.push(p.dayDelta);
        });

        teamBPlayers.forEach(p => {
          p.dayGames += 1;
          p.dayW += !aWon ? 1 : 0;
          p.dayL += !aWon ? 0 : 1;
          p.dayDiff -= pointDiffAB;
          p.dayDelta += deltaB;
          if (!Array.isArray(p.history) || p.history.length === 0) p.history = [0];
          p.history.push(p.dayDelta);
        });

        const now = Date.now();
        const scoreText = (m.customScoreA !== null && m.customScoreB !== null)
          ? `${m.customScoreA} : ${m.customScoreB}`
          : (aWon ? '左邊勝' : '右邊勝');

        state.matches.unshift({
          id: now,
          sessionId: state.currentSessionId,
          playedAt: now,
          mode: m.mode,
          winnerSide,
          teamA: teamAPlayers.map(p => p.name),
          teamB: teamBPlayers.map(p => p.name),
          scoreText,
          deltaA,
          deltaB
        });

        state.currentMatch = state.nextMatch
          ? Object.assign({}, state.nextMatch, { customScoreA: null, customScoreB: null, mode: state.pointMode })
          : null;
        syncMatchQueue();

        saveState();
        renderAll();
        showToast(aWon ? '已記錄左邊贏，下一場上場！' : '已記錄右邊贏，下一場上場！');
      }

      function undoLastMatch() {
        if (!state.undoMatchSnapshot) {
          showToast('沒有上一局可撤銷');
          return;
        }
        const snap = state.undoMatchSnapshot;
        state.players = snap.players;
        state.matches = snap.matches;
        state.currentMatch = snap.currentMatch;
        state.nextMatch = snap.nextMatch;
        state.undoMatchSnapshot = null;
        saveState();
        renderAll();
        showToast('已撤銷上一局勝負');
      }

      function shuffleNextMatch() {
        const active = getActivePlayers();
        const nextMap = {};
        active.forEach(p => { nextMap[p.id] = p.dayGames; });
        const extraRecent = [];
        if (state.currentMatch) {
          [...state.currentMatch.teamA, ...state.currentMatch.teamB].forEach(id => {
            if (nextMap[id] !== undefined) nextMap[id] += 1;
          });
          extraRecent.push({
            teamA: state.currentMatch.teamA,
            teamB: state.currentMatch.teamB
          });
        }
        state.nextMatch = buildMatchFromVirtualGames(nextMap, extraRecent);
        saveState();
        renderMatchTab();
        showToast('已隨機重排下一場');
      }

      function renderStatsTab() {
        document.getElementById('kpiTotalGames').textContent = state.matches.length;
        document.getElementById('kpi21Games').textContent = state.matches.filter(m => m.mode === 21).length;
        document.getElementById('kpi11Games').textContent = state.matches.filter(m => m.mode === 11).length;

        const sorted = [...state.players].sort((a, b) => b.dayDelta - a.dayDelta || b.dayW - a.dayW);
        const standingsEl = document.getElementById('standingsContainer');
        if (sorted.length === 0) {
          standingsEl.innerHTML = `<div class="empty-box">尚無球友戰績</div>`;
        } else {
          standingsEl.innerHTML = sorted.map(p => {
            const sign = p.dayDelta > 0 ? '+' : '';
            const cls = p.dayDelta > 0 ? 'delta-pos' : (p.dayDelta < 0 ? 'delta-neg' : '');
            return `
              <div class="standing-item js-show-trend" data-id="${p.id}">
                <div>
                  <div style="font-weight:800; font-size:14px;">${p.name} <span class="sub-text">（打 ${p.dayGames} 場）</span></div>
                  <div class="sub-text">${p.dayW}勝 ${p.dayL}負</div>
                </div>
                <div class="${cls}" style="font-size:15px;">${sign}${p.dayDelta}</div>
              </div>
            `;
          }).join('');
        }

        standingsEl.querySelectorAll('.js-show-trend').forEach(row => {
          row.addEventListener('click', () => showTrend(row.getAttribute('data-id')));
        });

        const histEl = document.getElementById('historyContainer');
        if (state.matches.length === 0) {
          histEl.innerHTML = `<div class="empty-box">尚無對戰紀錄</div>`;
          return;
        }

        const sessionMap = new Map();
        state.sessions.forEach((s, idx) => {
          sessionMap.set(s.id, {
            session: s,
            labelNum: state.sessions.length - idx,
            items: []
          });
        });

        state.matches.forEach(m => {
          const sid = m.sessionId || 'legacy';
          if (!sessionMap.has(sid)) {
            sessionMap.set(sid, {
              session: { id: sid, startTime: m.playedAt || m.id, endTime: m.playedAt || m.id },
              labelNum: 1,
              items: []
            });
          }
          sessionMap.get(sid).items.push(m);
        });

        let html = '';
        sessionMap.forEach(group => {
          if (group.items.length === 0) return;
          const s = group.session;
          const startStr = formatDateTime(s.startTime);
          const endStr = s.endTime ? formatTimeOnly(s.endTime) : '進行中';
          const isEnded = Boolean(s.endTime);

          html += `
            <div class="session-group ${isEnded ? 'ended' : ''}">
              <div class="session-divider-header">
                <span>場次 #${group.labelNum} · ${startStr} ~ ${endStr}</span>
                <span>共 ${group.items.length} 局</span>
              </div>
              ${group.items.map((m, idx) => {
                const winLabel = m.winnerSide === 'A' ? '左邊勝' : '右邊勝';
                const detailLabel = m.scoreText || winLabel;
                return `
                  <div class="history-row">
                    <div style="display:flex; justify-content:space-between; font-weight:800; margin-bottom:2px;">
                      <span>第 ${group.items.length - idx} 局（${m.mode}分制 · ${formatTimeOnly(m.playedAt || m.id)}）</span>
                      <span style="color:var(--primary);">${detailLabel}</span>
                    </div>
                    <div class="sub-text">${m.teamA.join('＋')} vs. ${m.teamB.join('＋')}</div>
                  </div>
                `;
              }).join('')}
            </div>
          `;
        });

        histEl.innerHTML = html;
      }

      function showTrend(playerId) {
        const p = getPlayer(playerId);
        if (!p) return;
        document.getElementById('trendCard').style.display = 'block';
        document.getElementById('trendTitle').textContent = `${p.name} 表現積分曲線`;
        document.getElementById('trendSubtitle').textContent = `目前累計積分 ${p.dayDelta >= 0 ? '+' : ''}${p.dayDelta}`;
        const pts = (Array.isArray(p.history) && p.history.length > 0) ? p.history : [0];
        const svg = document.getElementById('trendSvg');
        if (pts.length < 2) {
          svg.innerHTML = `<text x="160" y="64" text-anchor="middle" fill="#6E768A" font-size="13">再打幾場即可顯示曲線</text>`;
          return;
        }
        const minV = Math.min(...pts) - 10;
        const maxV = Math.max(...pts) + 10;
        const spanV = Math.max(1, maxV - minV);
        const coords = pts.map((val, idx) => [
          16 + (idx / (pts.length - 1)) * 288,
          16 + 86 - ((val - minV) / spanV) * 86,
          val
        ]);
        svg.innerHTML = `
          <polyline fill="none" stroke="#6A5ACD" stroke-width="2.8" stroke-linecap="round" points="${coords.map(c => `${c[0].toFixed(1)},${c[1].toFixed(1)}`).join(' ')}" />
          ${coords.map(c => `<circle cx="${c[0].toFixed(1)}" cy="${c[1].toFixed(1)}" r="4" fill="#6A5ACD" />`).join('')}
        `;
      }

      function openAccountModal() {
        const list = getAccountList();
        const container = document.getElementById('savedAccountsList');
        container.innerHTML = list.map(acc => {
          const isCurr = acc === currentAccount;
          return `
            <div style="display:flex; justify-content:space-between; align-items:center; padding:8px 10px; border-radius:10px; background:${isCurr ? 'var(--primary-soft)' : 'var(--bg)'}; border:1px solid ${isCurr ? 'var(--primary)' : 'var(--border)'};">
              <span style="font-weight:800; font-size:13px; color:${isCurr ? 'var(--primary)' : 'var(--text)'};">${acc} ${isCurr ? '（目前使用）' : ''}</span>
              ${!isCurr ? `<button type="button" class="mini-icon-btn js-switch-acc" data-acc="${acc}">切換</button>` : ''}
            </div>
          `;
        }).join('');

        container.querySelectorAll('.js-switch-acc').forEach(btn => {
          btn.addEventListener('click', () => {
            switchAccount(btn.getAttribute('data-acc'));
            document.getElementById('accountModal').classList.remove('open');
          });
        });

        document.getElementById('accountModal').classList.add('open');

      function switchAccount(accName) {
        const clean = (accName || '').trim();
        if (!clean) {
          showToast('請輸入球團名稱');
          return;
        }
        saveState();
        currentAccount = clean;
        localStorage.setItem(CURRENT_ACCOUNT_KEY, currentAccount);
        const list = getAccountList();
        if (!list.includes(currentAccount)) {
          saveAccountList([...list, currentAccount]);
        }
        state = loadStateForAccount(currentAccount);
        saveState();
        renderAll();
        showToast(`已切換至「${currentAccount}」`);
      }

      function addPlayerInternal(name, gender) {
        const clean = (name || '').trim();
        if (!clean) {
          showToast('請輸入暱稱');
          return false;
        }
        state.players.push({
          id: 'p_' + Date.now() + '_' + Math.random().toString(36).slice(2, 5),
          name: clean,
          gender: gender === 'F' ? 'F' : 'M',
          active: true,
          dayGames: 0,
          dayW: 0,
          dayL: 0,
          dayDiff: 0,
          dayDelta: 0,
          history: [0]
        });
        syncMatchQueue();
        saveState();
        renderAll();
        showToast(`已加入「${clean}」`);
        return true;
      }

      function copySummaryText() {
        const lines = [`【走啦~打球｜${currentAccount} 戰績】共 ${state.matches.length} 場`];
        [...state.players]
          .filter(p => p.dayGames > 0)
          .sort((a, b) => b.dayDelta - a.dayDelta)
          .forEach(p => {
            const sign = p.dayDelta > 0 ? '+' : '';
            lines.push(`• ${p.name}（${p.dayGames}場）：${p.dayW}勝${p.dayL}負（${sign}${p.dayDelta}）`);
          });
        navigator.clipboard?.writeText(lines.join('\n')).then(() => showToast('已複製戰績摘要'));
      }
